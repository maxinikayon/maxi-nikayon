<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>תודה – מקסי ניקיון</title>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;700;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Heebo', sans-serif;
      background: linear-gradient(135deg, #0abfbc, #079fa0, #045e6e);
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 20px;
    }
    .card {
      background: white; border-radius: 28px;
      padding: 56px 48px; text-align: center;
      max-width: 520px; width: 100%;
      box-shadow: 0 20px 60px rgba(0,0,0,.2);
      animation: popIn .6s cubic-bezier(.34,1.56,.64,1) both;
    }
    @keyframes popIn { from{opacity:0;transform:scale(.8)} to{opacity:1;transform:scale(1)} }
    .check-circle {
      width: 90px; height: 90px; border-radius: 50%;
      background: linear-gradient(135deg, #0abfbc, #079fa0);
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 28px;
      animation: pulse 2s infinite;
    }
    @keyframes pulse { 0%,100%{box-shadow:0 0 0 0 rgba(10,191,188,.4)} 50%{box-shadow:0 0 0 16px rgba(10,191,188,0)} }
    .check-circle svg { width: 48px; fill: white; }
    h1 { font-size: 2rem; font-weight: 900; color: #1a2e2e; margin-bottom: 14px; }
    p { font-size: 1.05rem; color: #5a7474; line-height: 1.75; margin-bottom: 32px; }
    p strong { color: #0abfbc; }
    .logo { height: 80px; margin-bottom: 24px; }
    .btn-back {
      display: inline-block;
      background: linear-gradient(135deg, #0abfbc, #079fa0);
      color: white; padding: 14px 36px; border-radius: 50px;
      font-weight: 700; font-size: 1rem; text-decoration: none;
      transition: transform .2s, box-shadow .2s;
    }
    .btn-back:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(10,191,188,.4); }
    .timer { font-size: .82rem; color: #aaa; margin-top: 16px; }
  </style>
</head>
<body>
  <div class="card">
    <img class="logo" src="logo.png" alt="מקסי ניקיון" />
    <div class="check-circle">
      <svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
    </div>
    <h1>קיבלנו את הפרטים שלך!</h1>
    <p>
      תודה שפנית אלינו.<br/>
      <strong>ניצור איתך קשר בהקדם האפשרי</strong><br/>
      וניתן לך את כל המידע הדרוש.
    </p>
    <a href="/" class="btn-back">חזרה לאתר</a>
    <p class="timer" id="timer">תועבר אוטומטית בעוד 7 שניות...</p>
  </div>
  <script>
    let s = 7;
    const t = document.getElementById('timer');
    const iv = setInterval(() => {
      s--;
      t.textContent = `תועבר אוטומטית בעוד ${s} שניות...`;
      if (s <= 0) { clearInterval(iv); window.location.href = '/'; }
    }, 1000);
  </script>
</body>
</html>
